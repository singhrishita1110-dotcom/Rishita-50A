<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Jokes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f4f9; min-height: 100vh; padding: 20px; }
    .joke-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .joke { background: #fff; padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .joke-type { color: #666; font-size: 14px; margin-bottom: 10px; display: block; }
    .joke-text { font-size: 20px; font-weight: bold; line-height: 1.5; }
    .joke-setup { color: #333; font-size: 16px; margin-bottom: 10px; }
    .joke-punchline { color: #2c3e50; font-size: 18px; }
    .controls { text-align: center; margin: 30px 0; }
    button { padding: 12px 24px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    button:hover { background: #555; }
    .error { color: #e74c3c; padding: 10px; background: #fdfdfd; border: 1px solid #e74c3c; border-radius: 4; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="joke-container">
    <h1>Random Jokes</h1>
    <div class="controls">
      <button onclick="fetchJoke()">Tell Me a Joke</button>
    </div>
    <div id="jokeArea"></div>
  </div>

  <script>
    async function fetchJoke() {
      const jokeArea = document.getElementById('jokeArea');
      jokeArea.innerHTML = '<div class="error">Loading joke...</div>';
      
      try {
        // Using the official joke API
        const response = await fetch('https://official-joke-api.appspot.com/random_jokes');
        const jokes = await response.json();
        
        if (jokes && jokes.length > 0) {
          const joke = jokes[0];
          let html = '';
          
          if (joke.type === 'single') {
            html = `<div class="joke">
                        <span class="joke-type">Single Joke</span>
                        <div class="joke-text">${joke.joke}</div>
                      </div>`;
          } else {
            html = `<div class="joke">
                        <span class="joke-type">General Joke</span>
                        <div class="joke-setup">${joke.setup}</div>
                        <div class="joke-punchline">${joke.punchline}</div>
                      </div>`;
          }
          
          jokeArea.innerHTML = html;
        } else {
          jokeArea.innerHTML = '<div class="error">No jokes found. Try again!</div>';
        }
      } catch (error) {
        jokeArea.innerHTML = '<div class="error">Failed to fetch joke. Please try again.</div>';
        console.error('Error fetching joke:', error);
      }
    }
    
    // Load a joke on page load
    document.addEventListener('DOMContentLoaded', () => {
      fetchJoke();
    });
  </script>
</body>
</html>
