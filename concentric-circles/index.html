<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concentric Circles</title>
  <style>
    .circle {
      position: absolute;
      border: 2px solid;
      border-radius: 50%;
    }
    .circle1 { width: 20px; height: 20px; top: 50%; left: 50%; margin: -10px 0 0 -10px; background: red; }
    .circle2 { width: 40px; height: 40px; top: 50%; left: 50%; margin: -20px 0 0 -20px; background: green; }
    .circle3 { width: 60px; height: 60px; top: 50%; left: 50%; margin: -30px 0 0 -30px; background: blue; }
  </style>
</head>
<body>
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>
</body>
</html>
